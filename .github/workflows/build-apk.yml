name: Build Nova APK

on:
  push:
    paths:
      - "NovaAndroid.zip"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -o NovaAndroid.zip -d nova-project

      - name: Locate the real project root (the folder with build.gradle.kts)
        id: find_root
        run: |
          ROOT=$(dirname "$(find nova-project -maxdepth 3 -name 'build.gradle.kts' -not -path '*/app/*' | head -n 1)")
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x "${{ steps.find_root.outputs.root }}/gradlew"

      - name: Build debug APK
        working-directory: ${{ steps.find_root.outputs.root }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apk
          path: "${{ steps.find_root.outputs.root }}/app/build/outputs/apk/debug/*.apk"
